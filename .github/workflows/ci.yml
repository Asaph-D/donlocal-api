# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t donlocal-api .

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Tag Docker image with commit
        run: |
          TAG=${{ github.sha }}
          docker tag donlocal-api ${{ secrets.DOCKER_USERNAME }}/donlocal-api:$TAG
          docker push ${{ secrets.DOCKER_USERNAME }}/donlocal-api:$TAG

