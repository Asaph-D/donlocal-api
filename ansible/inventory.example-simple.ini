# Configuration simplifiée pour un déploiement sur une seule machine (la VM)
# Copiez ce fichier vers inventory.ini et adaptez l'IP

[master]
# Utiliser l'IP statique de votre VM (remplacez par votre IP)
vm-master ansible_host=192.168.171.128 ansible_user=asaph ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Si Jenkins s'exécute sur la même machine que la VM, utilisez localhost :
# localhost ansible_connection=local ansible_user=asaph

[master:vars]
kubeconfig_path=/etc/kubernetes/admin.conf

# Pas de workers pour un déploiement simple
[workers]
# Commenté - pas de workers pour l'instant
# worker1 ansible_host=192.168.171.129 ansible_user=asaph ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

[workers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[k8s_cluster:children]
master
# workers  # Décommentez si vous ajoutez des workers

[k8s_cluster:vars]
k8s_version=1.28
pod_network_cidr=10.244.0.0/16





