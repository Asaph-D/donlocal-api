# Inventory Ansible pour le déploiement DonLocal
# Ce fichier définit les machines du cluster Kubernetes

# ============================================================================
# MASTER NODE
# ============================================================================
# Le nœud master est la machine de contrôle qui exécute kubeadm init
# et gère le cluster Kubernetes
[master]
# Machine de contrôle locale (utilise la connexion locale)
localhost ansible_connection=local ansible_user=asaph ansible_become=true ansible_become_method=sudo
# master-node ansible_host=127.0.0.1 ansible_user=root ansible_connection=ssh


# Pour utiliser une machine distante comme master, décommentez et configurez:
# master.example.com ansible_host=192.168.1.10 ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Variables spécifiques au master
[master:vars]
# Chemin vers le kubeconfig (sera configuré automatiquement)
kubeconfig_path=/etc/kubernetes/admin.conf

# ============================================================================
# WORKER NODES
# ============================================================================  
# Les nœuds workers rejoignent le cluster Kubernetes
# Ajoutez autant de workers que nécessaire

[workers]
# Worker 1 - WSL
# 172.20.216.6 ansible_user=root ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Worker 2 - Exemple (décommentez et configurez)
# worker2.example.com ansible_host=192.168.1.11 ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Worker 3 - Exemple (décommentez et configurez)
# worker3.example.com ansible_host=192.168.1.12 ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Variables communes pour tous les workers
[workers:vars]
# Options SSH communes pour tous les workers
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# ============================================================================
# GROUPES COMBINÉS
# ============================================================================
# Groupe pour toutes les machines du cluster
[k8s_cluster:children]
master
workers

# Variables pour tout le cluster
[k8s_cluster:vars]
# Version de Kubernetes à installer
k8s_version=1.28

# CIDR pour le réseau des pods
pod_network_cidr=10.244.0.0/16

# ============================================================================
# NOTES IMPORTANTES
# ============================================================================
# 1. SSH sans mot de passe requis:
#    - Générez une clé SSH: ssh-keygen -t ed25519
#    - Copiez-la sur les machines: ssh-copy-id user@host
#
# 2. Ports à ouvrir entre master et workers:
#    - 6443 (API server)
#    - 10250 (Kubelet API)
#    - 2379-2380 (etcd)
#    - 10251 (kube-scheduler)
#    - 10252 (kube-controller-manager)
#
# 3. Pour ajouter un nouveau worker:
#    - Ajoutez une ligne dans la section [workers]
#    - Format: hostname ansible_host=IP ansible_user=USER ansible_port=PORT ansible_ssh_private_key_file=PATH
#
# 4. Pour tester la connexion:
#    ansible all -i inventory.ini -m ping
