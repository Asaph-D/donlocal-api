# Exemple de configuration d'inventory pour plusieurs machines
# Copiez ce fichier vers inventory.ini et adaptez-le à votre environnement

# ============================================================================
# MASTER NODE
# ============================================================================
[master]
# Option 1: Machine locale (connexion locale)
localhost ansible_connection=local ansible_user=asaph

# Option 2: Machine distante (décommentez et configurez)
# master.example.com ansible_host=192.168.1.10 ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

[master:vars]
kubeconfig_path=/etc/kubernetes/admin.conf

# ============================================================================
# WORKER NODES
# ============================================================================
# Ajoutez autant de workers que nécessaire
[workers]
# Worker 1
# worker1.example.com ansible_host=192.168.1.11 ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Worker 2
# worker2.example.com ansible_host=192.168.1.12 ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Worker 3
# worker3.example.com ansible_host=192.168.1.13 ansible_user=ubuntu ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Exemple avec WSL (Windows Subsystem for Linux)
# 172.20.216.6 ansible_user=root ansible_port=22 ansible_ssh_private_key_file=~/.ssh/id_ed25519

[workers:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# ============================================================================
# GROUPES COMBINÉS
# ============================================================================
[k8s_cluster:children]
master
workers

[k8s_cluster:vars]
k8s_version=1.28
pod_network_cidr=10.244.0.0/16


