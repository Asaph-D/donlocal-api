---
# Secret Kubernetes pour les credentials PostgreSQL
# À utiliser en production au lieu de valeurs en clair

apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  labels:
    app: postgres
type: Opaque
stringData:
  POSTGRES_DB: "donlocal"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "1234"





