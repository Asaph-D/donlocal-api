apiVersion: apps/v1
kind: Deployment
metadata:
  name: donlocal-api
  labels:
    app: donlocal-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: donlocal-api
  template:
    metadata:
      labels:
        app: donlocal-api
    spec:
      containers:
      - name: donlocal-api
        image: asaphkouokam/donlocal-api:latest
        ports:
        - containerPort: 5000
        imagePullPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: donlocal-api
spec:
  type: NodePort
  selector:
    app: donlocal-api
  ports:
  - port: 5000
    targetPort: 5000
    nodePort: 30080