---
# Ansible playbook to build, push and deploy the donlocal-api to Kubernetes
- name: Deploy donlocal-api
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    image_name: "{{ lookup('env','IMAGE_NAME') | default('asaphkouokam/donlocal-api:latest') }}"
    manifests: "{{ lookup('env','K8S_MANIFEST') | default('kubernetes-config.yaml') }}"
    kubeconfig: "{{ lookup('env','KUBECONFIG') | default('') }}"

  tasks:
    - name: Ensure docker is available
      command: docker --version

    - name: Build Docker image
      shell: |
        docker build -t {{ image_name }} .
      args:
        chdir: "{{ playbook_dir }}"

    - name: Push Docker image
      shell: docker push {{ image_name }}

    - name: Apply Kubernetes manifests
      shell: |
        if [ -n "{{ kubeconfig }}" ]; then
          kubectl --kubeconfig={{ kubeconfig }} apply -f {{ manifests }}
        else
          kubectl apply -f {{ manifests }}
        fi

    - name: Wait for DB initialization job (donlocal-db-init) to complete (max 5m)
      shell: |
        if [ -n "{{ kubeconfig }}" ]; then
          kubectl --kubeconfig={{ kubeconfig }} wait --for=condition=complete job/donlocal-db-init --timeout=300s || true
        else
          kubectl wait --for=condition=complete job/donlocal-db-init --timeout=300s || true
        fi

    - name: Update deployment image (trigger rolling update)
      shell: |
        if [ -n "{{ kubeconfig }}" ]; then
          kubectl --kubeconfig={{ kubeconfig }} set image deployment/donlocal-api donlocal-api={{ image_name }} -n default || true
          kubectl --kubeconfig={{ kubeconfig }} rollout status deployment/donlocal-api -n default --timeout=300s
        else
          kubectl set image deployment/donlocal-api donlocal-api={{ image_name }} -n default || true
          kubectl rollout status deployment/donlocal-api -n default --timeout=300s
        fi

    - name: Show few logs from the API deployment
      shell: |
        kubectl logs deployment/donlocal-api --tail=30 || true

                                        // Use Ansible playbook for build/push/deploy (run under bash)
                                        sh '''
                                                if ! command -v ansible-playbook >/dev/null 2>&1; then
                                                    echo "❗ ansible-playbook not found on agent. Please install Ansible."
                                                    exit 1
                                                fi

                                                # Run the playbook under bash to avoid /bin/sh substitution issues
                                                bash -lc "ansible-playbook deploy.yml -i localhost, --extra-vars 'IMAGE_NAME=${IMAGE_NAME} K8S_MANIFEST=kubernetes-config.yaml'"
                                        '''