---
- name: Déployer donlocal-api sur Kubernetes
  hosts: localhost
  connection: local
  gather_facts: no
  
  vars:
    image_name: "{{ lookup('env', 'IMAGE_NAME') | default('asaphkouokam/donlocal-api:latest') }}"
    deployment_name: "donlocal-api"
    namespace: "default"
    kube_manifest: "kubernetes-config.yaml"
  
  tasks:
    - name: Afficher les informations de déploiement
      debug:
        msg: "🎯 Déploiement de {{ image_name }} sur Kubernetes"
        
    - name: Vérifier l'accès au cluster
      command: kubectl cluster-info
      register: cluster_check
      changed_when: false
      
    - name: Appliquer les manifestes Kubernetes
      command: kubectl apply -f {{ kube_manifest }}
      register: apply_result
      changed_when: "'configured' in apply_result.stdout or 'created' in apply_result.stdout"
      
    - name: Mettre à jour l'image du déploiement
      command: |
        kubectl set image deployment/{{ deployment_name }} \
          {{ deployment_name }}={{ image_name }} \
          -n {{ namespace }}
      register: image_update
      changed_when: "'updated' in image_update.stdout"
      
    - name: Attendre le rollout
      command: |
        kubectl rollout status deployment/{{ deployment_name }} \
          -n {{ namespace }} \
          --timeout=300s
      register: rollout
      until: rollout.rc == 0
      retries: 6
      delay: 10
      
    - name: Vérifier l'état des pods
      command: kubectl get pods -l app={{ deployment_name }} -n {{ namespace }} -o wide
      register: pods
      changed_when: false
      
    - name: Journaliser le résultat
      debug:
        msg:
          - "✅ Déploiement terminé"
          - "📊 Pods:"
          - "{{ pods.stdout_lines | join('\n  ') }}"